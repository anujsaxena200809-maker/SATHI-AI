<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22lgx%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2360a5fa%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%231e3a8a%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22url%28%23lgx%29%22/%3E%3Cg%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2225%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.4%22%20stroke-width%3D%221.5%22%20stroke-dasharray%3D%223%205%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%227%22%20r%3D%223.5%22%20fill%3D%22%23fff%22/%3E%3C/g%3E%3Cg%3E%3Cpath%20d%3D%22M32%2047s-13-8-13-18a7.5%207.5%200%200113-5%207.5%207.5%200%200113%205c0%2010-13%2018-13%2018z%22%20fill%3D%22%23f43f5e%22/%3E%3Cpath%20d%3D%22M32%2028v10M27%2033h10%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3C/svg%3E">
<title>SaathiCare</title>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--brand:#1d4ed8;--brand-dark:#1e3a8a;--navy:#0b1b3a;--navy2:#16305f;--ink:#000;--mut:#5b6b88;--card:#fff;--line:#dfe6f1;--surf:#f5f7f6;--or:#ff8a3d;--pk:#ff4f8b;--red:#e5233f;--teal:#12b5b0;--blue:#2f6bff;--ok:#16a870;--warn:#f2a100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;font-size:19px}
*{box-sizing:border-box;margin:0}
body{font-family:Roboto,"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;font-weight:700;color:var(--ink);background:#fff;min-height:100vh;padding-bottom:90px;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s var(--ease),border-color .3s,color .3s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:1.3rem;height:1.3rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.screen{display:none}.screen.on{display:block}
/* sign-in */
#signin{min-height:100vh;align-items:center;justify-content:center;padding:16px;transition:opacity .45s,transform .45s}
#signin.on{display:flex}#signin.leave{opacity:0;transform:translateY(-16px) scale(.98)}
.brand{display:flex;align-items:center;gap:10px;justify-content:center}.logo{display:inline-block;width:72px;height:72px}.logo svg{display:block;width:100%;height:100%}.orbit{transform-origin:32px 32px;animation:spin 7s linear infinite}.beat{transform-origin:32px 36px;animation:lub 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes lub{0%,30%,100%{transform:scale(1)}12%{transform:scale(1.14)}20%{transform:scale(1.02)}}
.word{font-size:43px;font-weight:800;letter-spacing:-.03em}.word b{color:var(--brand)}
.tag{text-align:center;color:var(--mut);font-size:1.1rem;margin-top:2px}
.brand.sm{justify-content:center;margin-bottom:6px}.brand.sm .logo{width:30px;height:30px}.brand.sm .word{font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:0 6px 20px rgba(11,27,58,.08)}
.si{width:min(440px,100%);margin:18px auto 0;padding:24px}
.si label{display:block;font-size:.9rem;font-weight:700;color:var(--mut);margin-top:6px}
.si input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surf);font-size:1.05rem;margin:4px 0 2px;transition:.2s}
::placeholder{font-size:.8rem;color:var(--mut);opacity:.7}
.si input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.2);outline:0}
.err{color:var(--red);font-size:.72rem;min-height:1rem}.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;font-size:.95rem;text-decoration:none;border:1.5px solid #60a5fa;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(30,64,175,.35)}
.btn:hover{background:var(--brand-dark);transform:translateY(-2px);box-shadow:0 7px 16px rgba(30,64,175,.45)}.btn.alt{background:#2563eb;color:#fff;border-color:#60a5fa}.btn.alt:hover{background:var(--brand-dark)}.btn.red{background:var(--red);border-color:#b91c1c}.btn.full{width:100%;margin-top:8px}
/* dashboard */
.wrap{max-width:900px;margin:auto;padding:12px 14px}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;color:var(--ink)}
.hello{font-size:1.5rem;font-weight:700}
.hello b{font-weight:800;color:var(--brand)}
.sub{font-size:.85rem;color:var(--mut)}
.ctl{display:flex;gap:6px;align-items:center;justify-content:center}
.ctl button,.ctl select{background:var(--brand);color:#fff;border:1.5px solid #60a5fa;border-radius:999px;padding:9px 15px;font-size:.88rem;font-weight:700}
.ctl option{color:#000}
.hero{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px;align-items:center;text-align:center}
.status{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.status small{display:block;font-size:.75rem;color:var(--mut)}.status b{font-size:1.1rem}
.hw{position:relative;display:block;transition:transform .3s ease}
.hw svg{display:block;width:136px;height:132px;fill:#d6246e;stroke:none;filter:drop-shadow(0 10px 16px rgba(214,36,110,.4));transition:fill .3s ease,filter .3s ease}
.status:hover .hw{transform:scale(1.07)}
.status:hover .hw svg{fill:#f0488f;filter:drop-shadow(0 14px 26px rgba(214,36,110,.6))}
.status:active .hw,.status.pressed .hw{transform:scale(.96)}
.status:active .hw svg,.status.pressed .hw svg{fill:#9d174d}
.hs{position:absolute;left:0;right:0;top:28%;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.status .hs small{color:#fff;font-size:.6rem;font-weight:700}
.status .hs b{color:#fff;font-size:1.7rem;font-weight:800;line-height:1.05}
.hs b::after{content:"/100";font-size:.55rem;font-weight:700;margin-left:3px;opacity:.9}
.feed{color:var(--mut);font-size:.74rem;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;line-height:1.35}
.feed b{color:var(--ink)}.live{flex:none;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.feed .btn{padding:5px 10px;font-size:.72rem;flex:none}
.alert{background:var(--red);color:#fff;border-radius:14px;padding:10px 12px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;animation:rise .4s}
.alert[hidden]{display:none}.alert b{flex:1 1 100%}.alert .btn{background:rgba(255,255,255,.22)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.m{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:10px 6px;text-align:center;display:grid;justify-items:center;gap:4px}
.m:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 18px rgba(37,99,235,.2)}
.m.act{border-color:var(--brand);box-shadow:0 0 0 2px rgba(37,99,235,.25)}
.m .mh{font-size:.68rem;color:var(--mut);display:flex;align-items:center;gap:6px}
.m b{font-size:1.25rem}.m small{font-size:.7rem;color:var(--mut);font-weight:700}
.gauge{width:64px;height:64px;transition:transform .2s}.m:hover .gauge{transform:scale(1.08)}
.sp{width:100%;height:20px}.chart{display:block;width:100%;max-width:320px;margin:6px auto 2px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;width:100%;max-width:520px}.quick .btn{width:100%}.quick .btn{padding:12px 12px;font-size:.9rem}.quick .ic{width:1rem;height:1rem}
.row:hover,.rm:hover{background:var(--surf)}.ctl button:hover,.ctl select:hover{background:var(--brand-dark)}.chips button:hover{background:rgba(255,255,255,.3)}
.flash{box-shadow:0 0 0 3px rgba(37,99,235,.3)}
.bigw{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0}.bigw .gauge{width:120px;height:120px}
.rcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.rc{text-align:center}.rc .gauge{width:100%;max-width:60px}.rc small{display:block;font-size:.7rem;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--red)}
.chip{font-style:normal;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:700;background:rgba(22,168,112,.15);color:var(--ok)}
.chip.warn{background:rgba(242,161,0,.18);color:#b57700}.chip.crit{background:rgba(229,35,63,.15);color:var(--red)}
.duo{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
h2{font-size:1rem;margin-bottom:6px}
.rm{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:18px;margin-top:8px;border-radius:18px;transition:.3s}
.rm small{display:block;color:var(--mut);font-size:.72rem}
.rm.done{background:rgba(22,168,112,.1)}.rm.done b{text-decoration:line-through}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.done .chk{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .5s}
.bar.w{width:90px}
.add{display:flex;gap:6px;margin-top:10px}.add input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surf);font-size:.85rem}
/* care wheel */
.ringcard{text-align:center;padding:14px 4px}
.wheel{position:relative;width:300px;height:300px;margin:6px auto}
.ring{position:absolute;inset:0;transform:rotate(var(--spin,0deg))}
.ring::before{content:"";position:absolute;inset:12px;border:2px dashed #bfdbfe;border-radius:50%}
.rb{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 12px rgba(11,27,58,.12);display:grid;place-items:center;align-content:center;font-size:.62rem;font-weight:700;transform:rotate(var(--a)) translateY(-100px) rotate(calc(-1*var(--a) - var(--spin,0deg)));transition:background .25s,border-color .25s,box-shadow .25s}
.rb .ic{width:1.15rem;height:1.15rem}.rb:active{transform:rotate(var(--a)) translateY(-100px) rotate(calc(-1*var(--a) - var(--spin,0deg))) scale(.94)}
.rb:hover{border-color:var(--brand);background:#eff6ff;box-shadow:0 6px 16px rgba(37,99,235,.3)}.rb.on{background:var(--brand);color:#fff}
.sos{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:1.1rem;letter-spacing:.05em;box-shadow:0 6px 18px rgba(229,35,63,.5)}
.sos::before,.sos::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);animation:wave 2s infinite}.sos::after{animation-delay:1s}
@keyframes wave{to{transform:scale(1.7);opacity:0}}
.foot{font-size:.72rem;color:var(--mut);text-align:center;margin:16px 0 4px}
/* panels, assistant, toast */
.ov{position:fixed;inset:0;background:rgba(7,15,35,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.ov[hidden]{display:none}@keyframes fade{from{opacity:0}}
.panel{background:var(--card);width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:30px 30px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.ov{align-items:center}.panel{border-radius:30px}.grid{grid-template-columns:repeat(3,1fr)}}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ph h3{font-size:1.05rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.note{font-size:.78rem;color:var(--mut);margin:6px 0;line-height:1.4}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.big{font-size:1.6rem;font-weight:800;display:flex;align-items:baseline;gap:8px}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.map{width:100%;border-radius:22px;border:1px solid var(--line)}
.route{stroke:var(--blue);stroke-width:3;stroke-dasharray:6 5;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-11}}
.tl{padding-left:18px;font-size:.85rem;line-height:1.7}.tl li{animation:rise .4s}
.sosbox{background:rgba(229,35,63,.1);border-left:4px solid var(--red);padding:8px 10px;border-radius:8px;font-size:.82rem}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 20px));display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 8px 24px rgba(11,27,58,.25);z-index:40}
.dock input{flex:1;border:0;background:none;padding:0 10px;font-size:.9rem;outline:0;min-width:0}
.dock button{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;border:1.5px solid #60a5fa;display:grid;place-items:center;box-shadow:0 2px 6px rgba(30,64,175,.35)}.dock .go{background:var(--brand);color:#fff}.dock [aria-pressed=true]{background:#0d9488;color:#fff}
#bubble{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 20px));background:var(--navy);color:#fff;border-radius:24px;padding:14px 16px;z-index:60;font-size:.88rem;line-height:1.4;animation:up .3s;max-height:40vh;overflow:auto}
#bubble[hidden]{display:none}.bx{float:right;color:#9fb0d0;font-size:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:4px 10px;font-size:.74rem}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:10px;font-size:.82rem;z-index:80;transition:.3s;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
.btn::before,.side button::before{content:"";position:absolute;top:0;left:-120%;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .6s ease;pointer-events:none}
.btn:hover::before,.side button:hover::before{left:140%}
.btn .ic{transition:transform .3s ease}.btn:hover .ic{transform:scale(1.2) rotate(-8deg)}
.dock button:hover,.ctl button:hover{background:var(--brand-dark);box-shadow:0 4px 10px rgba(30,64,175,.4)}.dock .go:hover{background:var(--brand-dark)}
.btn:active,.btn.pressed,.btn.alt:active,.btn.alt.pressed{background:var(--red);border-color:#b91c1c;color:#fff;box-shadow:0 4px 12px rgba(229,35,63,.55);transform:scale(.95)}
.btn.pressed,.side button.pressed{animation:bpop .4s ease}
@keyframes bpop{40%{transform:scale(.9)}70%{transform:scale(1.05)}}
.btn.red:hover{background:#c81e36}.btn.red:active,.btn.red.pressed{background:#7f1d1d;border-color:#7f1d1d}
.m:active,.m.pressed{background:#fee2e2;border-color:var(--red)}
.rb:active,.rb.pressed,.rb.on:active,.rb.on.pressed,.ctl button:active,.ctl button.pressed,.dock button:active,.dock button.pressed{background:var(--red);border-color:#b91c1c;color:#fff}
.card,.rm,.row{transition:background .3s,border-color .3s,box-shadow .3s}
.side{overflow-x:auto;scrollbar-width:none;padding:6px 0 10px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.track{display:flex;width:max-content}
@keyframes slide{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.side::-webkit-scrollbar{display:none}
.side button{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;flex:none;margin-right:8px;padding:10px 18px;border-radius:999px;border:1.5px solid #60a5fa;background:var(--brand);color:#fff;font-size:.92rem;font-weight:700;box-shadow:0 2px 6px rgba(30,64,175,.3)}
.side button:hover{background:var(--brand-dark);transform:translateY(-2px);box-shadow:0 6px 14px rgba(30,64,175,.4)}
.side button.on{background:var(--brand-dark);border-color:#fff;box-shadow:0 0 0 2px var(--brand)}
.side button:active,.side button.pressed{background:var(--red);border-color:#b91c1c}
.side .em{background:#b91c1c;border-color:#fca5a5}.side .em:hover{background:#991b1b}.side .em.on{background:#7f1d1d}.side .em:active,.side .em.pressed{background:var(--red)}
.side .ic{width:1rem;height:1rem}
.srch{max-width:520px;margin-left:auto!important;margin-right:auto!important;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;margin:2px 0 6px;color:var(--mut)}
.srch:focus-within{border-color:var(--brand)}.srch input{flex:1;border:0;outline:0;background:none;font-size:.85rem;min-width:0}
#bell{position:relative}.nd{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.av.sm{width:30px;height:30px;font-size:.8rem}
.appt{margin-top:12px}.card+.card{margin-top:10px}
.eyebrow{font-size:.7rem;letter-spacing:.12em;color:var(--brand);font-weight:700;margin-top:6px}
.pt{font-size:1.4rem;margin:2px 0 10px}h3{font-size:.95rem;margin:14px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.tile{display:grid;gap:3px;text-align:left;justify-items:start;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:14px}
.tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 18px rgba(37,99,235,.2)}.tile:active,.tile.pressed{background:#fee2e2;border-color:var(--red)}
.tile small{font-size:.72rem;color:var(--mut)}
.ti{width:38px;height:38px;border-radius:12px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;margin-bottom:4px}
.field{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:.85rem}
.field:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px rgba(37,99,235,.2)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats .card{margin:0!important}
.sosrow{background:rgba(229,35,63,.1);border:1.5px solid var(--red);border-radius:24px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#bfdbfe 0%,#eff6ff 38%,#fff 62%,#dbeafe 100%)}
.sos::before,.sos::after{pointer-events:none}
.hw::before,.hw::after{content:"";position:absolute;left:50%;top:48%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:2px solid #d6246e;animation:wave 2.4s infinite;pointer-events:none}

<script>

const LANG = {
  en:{ morning:"Good morning", afternoon:"Good afternoon", evening:"Good evening", ok:"Everything looks stable. Here's your health overview.", bad:"Some readings need attention." },
  hi:{ morning:"सुप्रभात", afternoon:"नमस्कार", evening:"शुभ संध्या", ok:"सब कुछ स्थिर दिख रहा है। यह आपका स्वास्थ्य अवलोकन है।", bad:"कुछ रीडिंग पर ध्यान देने की जरूरत है।" }
};
const NAMES = ["Stable","Needs attention","Critical"], CLS = ["ok","warn","crit"], COLORS = ["#16a870","#f2a100","#e5233f"];
const state = { page:"dashboard", report:"blood", metric:null, lang:"en", speak:false, loc:null };

/* ============ 2. SMALL HELPERS ============ */
const $ = id => document.getElementById(id);
const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function toast(t, ms = 2800){ const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), ms); }

/* ============ 3. HEALTH LOGIC ============ */
const last = k => metrics[k].data.at(-1);
function val(k){ const m = metrics[k]; return m.data2 ? last(k)+"/"+m.data2.at(-1) : last(k); }
function statusOf(k, v){ const m = metrics[k];   // 0 stable, 1 attention, 2 critical
  if(v >= m.ok[0] && v <= m.ok[1]) return 0;
  return (v >= m.warn[0] && v <= m.warn[1]) ? 1 : 2; }
const status = k => statusOf(k, last(k));
const overall = () => Math.max(...Object.keys(metrics).map(status));
// Health score (demo): stable readings score 90-100 depending on how central they are, attention = 70, critical = 30; then averaged
function healthScore(){ const pts = Object.keys(metrics).map(k => { const m = metrics[k], s = status(k); if(s) return s === 1 ? 70 : 30;
    const mid = (m.ok[0] + m.ok[1]) / 2, half = (m.ok[1] - m.ok[0]) / 2; return 100 - 10 * Math.min(1, Math.abs(last(k) - mid) / half); });
  return Math.round(pts.reduce((a, b) => a + b) / pts.length); }
function trend(k){ const a = metrics[k].data, d = a.at(-1) - a[0]; return d > a[0]*.03 ? "rising" : d < -a[0]*.03 ? "falling" : "steady"; }
function explainMetric(k){ const m = metrics[k];
  return `${m.label}: ${val(k)} ${m.unit}. ${NAMES[status(k)]}, trend ${trend(k)}. Informational only - consider contacting a healthcare professional if unsure.`; }
function smooth(p){ let d = `M${p[0][0]},${p[0][1]}`;   // joins the points with soft curves
  for(let i = 1; i < p.length; i++){ const mx = (p[i-1][0] + p[i][0]) / 2; d += ` C${mx},${p[i-1][1]} ${mx},${p[i][1]} ${p[i][0]},${p[i][1]}`; }
  return d; }
function spark(a, w=84, h=24){ const mn = Math.min(...a), mx = Math.max(...a);
  const p = a.map((v,i) => [+(i/(a.length-1)*w).toFixed(1), +(h-3-(v-mn)/(mx-mn||1)*(h-6)).toFixed(1)]), d = smooth(p);
  return `<svg class="sp" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d} L${w},${h} L0,${h}Z" fill="url(#gfill)"/><path d="${d}" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`; }
function chart(a, b){ const w = 300, h = 84, all = b ? a.concat(b) : a, mn = Math.min(...all) - 1, mx = Math.max(...all) + 1;
  const pts = arr => arr.map((v,i) => [+((i/(arr.length-1))*(w-40)+28).toFixed(1), +(h-12-((v-mn)/(mx-mn))*(h-26)).toFixed(1)]);
  const line = (arr, c, fill, nm) => { const p = pts(arr), d = smooth(p), e = p.at(-1);
    return (fill ? `<path d="${d} L${e[0]},${h-8} L${p[0][0]},${h-8}Z" fill="url(#gfill)"/>` : "") + `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/><circle cx="${e[0]}" cy="${e[1]}" r="4" fill="${c}" stroke="#fff" stroke-width="2"/>` + p.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="9" fill="transparent" onclick="toast('${nm} - reading ${i+1}: ${arr[i]}')"/>`).join(""); };
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" rx="20" fill="var(--surf)"/><g stroke="var(--line)" stroke-dasharray="3 4"><line x1="28" x2="${w-12}" y1="${h*.3}" y2="${h*.3}"/><line x1="28" x2="${w-12}" y1="${h*.65}" y2="${h*.65}"/></g><g fill="var(--mut)" font-size="9"><text x="8" y="16">${Math.round(mx)}</text><text x="8" y="${h-10}">${Math.round(mn)}</text></g>${line(a,"#1d4ed8",true,b ? "Systolic" : "Value")}${b ? line(b,"#ff4f8b",false,"Diastolic") : ""}</svg>`; }
/* every metric is drawn as a ring, like the care wheel: the arc shows where the value sits inside its range */
function gauge(k, i = metrics[k].data.length - 1){ const m = metrics[k], v = m.data[i], v2 = m.data2 ? m.data2[i] : null;
  const f = Math.min(1, Math.max(0, m.goal ? v / m.goal : (v - m.warn[0]) / (m.warn[1] - m.warn[0]))), C = 276.5, col = COLORS[statusOf(k, v)];
  return `<svg class="gauge" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="50" cy="50" r="44" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(f*C).toFixed(1)} ${C}" transform="rotate(-90 50 50)"/><circle cx="50" cy="50" r="33" fill="none" stroke="var(--line)" stroke-dasharray="2 5"/><text x="50" y="54" text-anchor="middle" font-size="${v2 ? 17 : 22}" font-weight="700" fill="var(--ink)">${v2 ? v + "/" + v2 : v}</text><text x="50" y="68" text-anchor="middle" font-size="9" fill="var(--mut)">${m.unit}</text></svg>`; }

  w.addEventListener("pointerdown", () => wheelPaused = true);   // stop while a finger is down so taps always land

async function runCheck(low){

    const bar = row.querySelector("i"); bar.style.transition = "width 1s linear"; requestAnimationFrame(() => bar.style.width = "100%");

function beep(){ if(!settings.sound) return; try{ const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(a.currentTime + .25); }catch(e){} }
function countTo(el, to){ const from = +el.textContent || 0, t0 = performance.now();
  (function f(t){ const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(from + (to - from) * k); if(k < 1) requestAnimationFrame(f); })(t0); }

// SOS: hold the button for 3 seconds; letting go early cancels
let sosTimer = null;
function holdSOS(start){ const bar = $("holdBar"); if(!bar) return;
  if(!start){ if(!sosTimer) return; clearInterval(sosTimer); sosTimer = null; bar.style.transition = "none"; bar.style.width = "0"; $("holdTxt").textContent = "Hold 3 seconds to send SOS alert"; return; }
  let n = 3; $("holdTxt").textContent = "Keep holding... 3"; bar.style.transition = "width 3s linear"; bar.style.width = "100%";
  sosTimer = setInterval(() => { n--; if(n > 0) return $("holdTxt").textContent = "Keep holding... " + n;
    clearInterval(sosTimer); sosTimer = null; sendSOS(); }, 1000); }

// real heart-rate band over Bluetooth (Chrome on Android; not available in every browser)
async function connectHR(){
  if(!navigator.bluetooth) return toast("Bluetooth is not available in this browser. Try Chrome on Android.");
  try{ const dev = await navigator.bluetooth.requestDevice({ filters:[{ services:["heart_rate"] }] });
    const svc = await (await dev.gatt.connect()).getPrimaryService("heart_rate"), ch = await svc.getCharacteristic("heart_rate_measurement");
    await ch.startNotifications(); state.btHR = true;
    ch.addEventListener("characteristicvaluechanged", e => { const d = e.target.value; pushReading("hr", (d.getUint8(0) & 1) ? d.getUint16(1, true) : d.getUint8(1)); });
    dev.addEventListener("gattserverdisconnected", () => { state.btHR = false; toast("Heart-rate band disconnected."); if(state.page === "devices") renderPage(); });
    toast("Connected: " + (dev.name || "heart-rate band") + " (live)"); if(state.page === "devices") renderPage();
  }catch(e){ toast("Bluetooth not connected: " + (e.message || "cancelled")); } }

const origText = new WeakMap();
function translateDom(root){ const hi = state.lang === "hi", w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for(let n = w.nextNode(); n; n = w.nextNode()){ const raw = origText.has(n) ? origText.get(n) : n.nodeValue, key = raw.trim();
    if(HI[key]){ origText.set(n, raw); n.nodeValue = hi ? raw.replace(key, HI[key]) : raw; } }
  root.querySelectorAll("[placeholder]").forEach(el => { el.dataset.ph = el.dataset.ph || el.placeholder; el.placeholder = hi && HI[el.dataset.ph] ? HI[el.dataset.ph] : el.dataset.ph; }); }

function showLoader(msg, ms, done){ const l = $("loader"), bar = l.querySelector(".lbar i"); $("ltxt").textContent = msg; l.hidden = false; l.classList.remove("out");
  bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = `load ${ms}ms ease forwards`;

// the menu strip drifts slowly left to right; drag it with a finger or mouse to pull it yourself
function startNavScroll(){ const s = $("side"); let pos = 0, paused = false, last = 0;
  const hold = () => paused = true, release = () => setTimeout(() => { pos = s.scrollLeft; paused = false; }, 1500);
  ["touchstart", "pointerdown", "wheel"].forEach(e => s.addEventListener(e, hold, { passive:true }));
  ["touchend", "pointerup", "pointercancel"].forEach(e => s.addEventListener(e, release));
  if(matchMedia("(hover: hover)").matches){ s.addEventListener("mouseenter", hold); s.addEventListener("mouseleave", release); }
  s.scrollLeft = pos = s.scrollWidth / 2;
  (function f(t){ const half = s.scrollWidth / 2;
    if(!paused && !matchMedia("(prefers-reduced-motion: reduce)").matches){ pos -= (t - last) * 0.03; if(pos <= 0) pos += half; s.scrollLeft = pos; }
    else if(s.scrollLeft <= 0) s.scrollLeft += half; else if(s.scrollLeft >= half) s.scrollLeft -= half;   // keeps the loop endless while dragging
    last = t; requestAnimationFrame(f); })(0); }
